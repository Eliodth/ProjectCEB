    <i class="fa-solid fa-user-circle"></i>
</div>

<div class="campana-notificaciones" id="campanaNotificaciones">
    🔔
    <span id="contadorNotificaciones">0</span>

    <div class="lista-notificaciones" id="listaNotificaciones">
        <div class="titulo-notificaciones">
            Notificaciones

        <div id="contenidoNotificaciones">

                No tienes notificaciones.

    Cerrar sesión

</header>

<div class="container">

    <div class="card">

        <h2>Registrar excusas</h2>
        
        <form id="formExcusa">
            
            <select id="tipoExcusa" required>
                <option value="">Selecciona el tipo de excusa</option>
                <option value="Inasistencia">Inasistencia</option>
                <option value="Salud">Salud</option>
                <option value="Uniforme">Uniforme</option>
             </select>

    
<input
    type="text"
    id="nombreEstudiante"
    placeholder="Nombre completo del estudiante"
    required
>

<input
    type="text"
    id="nombreAcudiente"
    placeholder="Nombre del acudiente"
    required
>

<input
    type="text"
    id="detalleExcusa"
    placeholder="Detalle de la Excusa"
    required
>


    <label for="fecha">Selecciona una fecha de registro:</label>
    <input type="date" id="fecha" required>

    <input
        type="text"
        id="firmaDigital"
        placeholder="Firma digital"
        required
    >

    <input type="file" id="archivoExcusa" required>

    <button type="submit">Enviar</button>

    <div id="mensajeExito" class="mensaje-exito" style="display: none;">
        ¡La excusa se envió correctamente!
    </div>

</form>


    </div>

</div>

<div class="card">
    
    <h2>Registro de excusas</h2>

    <table id="tablaExcusas">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tipo</th>
                <th>Estudiante</th>
                <th>Acudiente</th>
            </tr>
        </thead>

</div>

<footer>

    <p>Project CEB 2026</p>
</footer>

<script src="script.js"></script>
